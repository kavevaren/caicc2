<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; display: flex; font-family: sans-serif; }
  .pane { width: 420px; height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .light { background: #f7f8fa; }
  .dark { background: #14151a; }
  .lbl { font-size: 13px; color: #888; }
</style>
</head>
<body>
  <div class="pane light">
    <svg width="240" height="202" viewBox="0 0 100 84" aria-hidden="true">
      <g fill="none" stroke="#1e6fae" stroke-width="9">
        <ellipse cx="50" cy="42" rx="42.1" ry="31.6" transform="rotate(-20 50 42)" />
        <ellipse cx="50" cy="42" rx="42.1" ry="31.6" transform="rotate(20 50 42)" />
      </g>
      <path d="M 19.3 42 A 32.1 32.1 0 0 1 80.7 42 A 32.1 32.1 0 0 1 19.3 42 Z" fill="#ffffff" stroke="#1e6fae" stroke-width="9" stroke-linejoin="round" />
      <circle cx="50" cy="42" r="12.1" fill="#f4a05c" />
    </svg>
    <span class="lbl">light</span>
  </div>
  <div class="pane dark">
    <svg width="240" height="202" viewBox="0 0 100 84" aria-hidden="true">
      <g fill="none" stroke="#1e6fae" stroke-width="9">
        <ellipse cx="50" cy="42" rx="42.1" ry="31.6" transform="rotate(-20 50 42)" />
        <ellipse cx="50" cy="42" rx="42.1" ry="31.6" transform="rotate(20 50 42)" />
      </g>
      <path d="M 19.3 42 A 32.1 32.1 0 0 1 80.7 42 A 32.1 32.1 0 0 1 19.3 42 Z" fill="#ffffff" stroke="#1e6fae" stroke-width="9" stroke-linejoin="round" />
      <circle cx="50" cy="42" r="12.1" fill="#f4a05c" />
    </svg>
    <span class="lbl">dark</span>
  </div>
</body>
</html>
